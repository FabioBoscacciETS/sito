name: Aggiorna Televideo

on:
  workflow_dispatch:
  schedule:
  - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recupera notizie Televideo
        run: |
          python -m pip install beautifulsoup4

          python - <<'PY'
          import urllib.request
          import json
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup

          url = "https://www.televideo.rai.it/televideo/pub/solotesto.jsp?pagina=101"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Cache-Control": "no-cache"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              charset = response.headers.get_content_charset() or "utf-8"
              pagina = response.read().decode(charset, errors="replace")

          soup = BeautifulSoup(pagina, "html.parser")
          testo = soup.get_text(" ", strip=True)

          pattern = re.compile(
              r"(\d{2}/\d{2})\s+(\d{2}:\d{2})\s+(.+?)"
              r"(?=\s+\d{2}/\d{2}\s+\d{2}:\d{2}\s+|$)"
          )

          oggi = datetime.now(ZoneInfo("Europe/Rome")).strftime("%d/%m")

          news = []
          visti = set()

          for data, ora, titolo in pattern.findall(testo):

              titolo = " ".join(titolo.split())

              if data != oggi:
                  continue

              chiave = (ora, titolo)

              if chiave in visti:
                  continue

              visti.add(chiave)

              news.append({
                  "title": f"{ora.replace(':', '.')} {titolo}",
                  "link": url,
                  "description": "",
                  "date": datetime.now(
                      ZoneInfo("Europe/Rome")
                  ).isoformat()
              })

              if len(news) == 6:
                  break

          if not news:
              raise RuntimeError(
                  "Televideo non contiene notizie con la data odierna"
              )

          with open("televideo.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)

          print(f"Salvate {len(news)} notizie Televideo di oggi")
          PY

      - name: Salva aggiornamento
        run: |
          git config user.name "Televideo Bot"
          git config user.email "actions@github.com"
          git add televideo.json

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento"
          else
            git commit -m "Aggiorna notizie Televideo"
            git push
          fi
