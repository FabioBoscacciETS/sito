name: Aggiorna Televideo

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recupera notizie Televideo
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import html

          url = "https://www.televideo.rai.it/televideo/pub/rss101.xml"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          root = ET.fromstring(data)

          news = []

          for item in root.findall(".//item")[:6]:
              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              description = item.findtext("description", "").strip()
              pubdate = item.findtext("pubDate", "").strip()

              news.append({
                  "title": html.unescape(title),
                  "link": link,
                  "description": html.unescape(description),
                  "date": pubdate
              })

          with open("televideo.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)

          print(f"Salvate {len(news)} notizie")
          PY

      - name: Salva aggiornamento
        run: |
          git config user.name "Televideo Bot"
          git config user.email "actions@github.com"
          git add televideo.json

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento"
          else
            git commit -m "Aggiorna notizie Televideo"
            git push
          fi
