name: Aggiorna Televideo

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recupera notizie Televideo
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import json
          import re
          from html.parser import HTMLParser

          class TelevideoParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_link = False
                  self.href = ""
                  self.text = []
                  self.items = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.in_link = True
                      self.href = dict(attrs).get("href", "")
                      self.text = []

              def handle_data(self, data):
                  if self.in_link:
                      self.text.append(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.in_link:
                      testo = " ".join("".join(self.text).split())

                      m = re.match(
                          r"^(\d{2}\.\d{2})\s*\|\s*(.+)$",
                          testo
                      )

                      if m:
                          self.items.append(
                              (m.group(1), m.group(2), self.href)
                          )

                      self.in_link = False
                      self.href = ""
                      self.text = []

          url = "https://www.televideo.rai.it/televideo/pub/index.jsp"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              charset = response.headers.get_content_charset() or "utf-8"
              pagina = response.read().decode(
                  charset,
                  errors="replace"
              )

          parser = TelevideoParser()
          parser.feed(pagina)

          news = []
          visti = set()

          for ora, titolo, href in parser.items:
              chiave = (ora, titolo)

              if chiave in visti:
                  continue

              visti.add(chiave)

              news.append({
                  "title": f"{ora} {titolo}",
                  "link": urllib.parse.urljoin(url, href),
                  "description": "",
                  "date": ""
              })

              if len(news) == 6:
                  break

          if not news:
              raise RuntimeError(
                  "Nessuna notizia Ultim'ora trovata nella pagina Televideo"
              )

          with open("televideo.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)

          print(f"Salvate {len(news)} notizie")
          PY

      - name: Salva aggiornamento
        run: |
          git config user.name "Televideo Bot"
          git config user.email "actions@github.com"
          git add televideo.json

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento"
          else
            git commit -m "Aggiorna notizie Televideo"
            git push
          fi
